<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字牌 · Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #0f0800;
    --paper:      #f2e6cc;
    --gold:       #c9a84c;
    --gold-light: #e8c96a;
    --red:        #b02020;
    --panel:      #1e0f03;
    --border:     rgba(201,168,76,0.25);
    --input-bg:   rgba(255,255,255,0.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ink);
    color: var(--paper);
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, #3a1500 0%, transparent 70%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    padding: 2rem;
  }

  .auth-wrap {
    width: 100%; max-width: 420px;
    animation: fadeUp 0.6s ease-out;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .logo { text-align: center; margin-bottom: 2.5rem; }
  .logo-hanzi {
    font-family: 'Noto Serif SC', serif;
    font-size: 5rem; font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.35), 3px 3px 0 var(--red);
    line-height: 1; display: block;
  }
  .logo-sub {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.75rem; letter-spacing: 0.3em;
    color: rgba(242,230,204,0.5);
    text-transform: uppercase; margin-top: 0.5rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }

  .tabs {
    display: flex; gap: 0; margin-bottom: 2rem;
    background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 4px;
  }
  .tab {
    flex: 1; padding: 0.6rem; text-align: center;
    border: none; background: transparent;
    color: rgba(242,230,204,0.5);
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
    cursor: pointer; border-radius: 8px; transition: all 0.2s;
  }
  .tab.active {
    background: var(--gold); color: var(--ink);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(201,168,76,0.4);
  }

  .form { display: none; }
  .form.active { display: block; }

  .field { margin-bottom: 1.25rem; }
  .field label {
    display: block; font-size: 0.75rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(242,230,204,0.5); margin-bottom: 0.5rem;
  }
  .field input {
    width: 100%; padding: 0.8rem 1rem;
    background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--paper);
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--gold); }
  .field input::placeholder { color: rgba(242,230,204,0.25); }

  .btn-submit {
    width: 100%; padding: 0.9rem;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--ink); border: none; border-radius: 12px;
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 16px rgba(201,168,76,0.3);
    margin-top: 0.5rem;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.5); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg {
    background: rgba(176,32,32,0.15); border: 1px solid rgba(176,32,32,0.4);
    color: #ff8080; border-radius: 8px; padding: 0.7rem 1rem;
    font-size: 0.85rem; margin-top: 1rem; display: none;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="logo">
    <span class="logo-hanzi">漢字牌</span>
    <div class="logo-sub">Hán Tự Bài · Trò Chơi Ghép Chữ</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <!-- LOGIN -->
    <div class="form active" id="form-login">
      <div class="field">
        <label>Tên đăng nhập</label>
        <input type="text" id="login-username" placeholder="Nhập tên đăng nhập" autocomplete="username">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="Nhập mật khẩu" autocomplete="current-password">
      </div>
      <button class="btn-submit" id="btn-login" onclick="doLogin()">登入 · Đăng nhập</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- REGISTER -->
    <div class="form" id="form-register">
      <div class="field">
        <label>Tên đăng nhập</label>
        <input type="text" id="reg-username" placeholder="3–50 ký tự" autocomplete="username">
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
      </div>
      <button class="btn-submit" id="btn-register" onclick="doRegister()">注册 · Đăng ký</button>
      <div class="error-msg" id="register-error"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Nếu đã đăng nhập → vào game luôn
  if (Api.isLoggedIn()) window.location.href = 'game.html';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0) === (tab === 'login'));
    });
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError(id) {
    document.getElementById(id).classList.remove('show');
  }

  async function doLogin() {
    clearError('login-error');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { showError('login-error', 'Vui lòng điền đầy đủ thông tin'); return; }

    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Đang xử lý...';

    try {
      await Api.login(username, password);
      window.location.href = 'game.html';
    } catch (e) {
      showError('login-error', e.message);
      btn.disabled = false; btn.textContent = '登入 · Đăng nhập';
    }
  }

  async function doRegister() {
    clearError('register-error');
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;

    if (!username || !password) { showError('register-error', 'Vui lòng điền đầy đủ thông tin'); return; }
    if (password !== confirm)   { showError('register-error', 'Mật khẩu xác nhận không khớp'); return; }

    const btn = document.getElementById('btn-register');
    btn.disabled = true; btn.textContent = 'Đang xử lý...';

    try {
      await Api.register(username, password);
      window.location.href = 'game.html';
    } catch (e) {
      showError('register-error', e.message);
      btn.disabled = false; btn.textContent = '注册 · Đăng ký';
    }
  }

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('form-login').classList.contains('active')) doLogin();
    else doRegister();
  });
</script>
</body>
</html>
